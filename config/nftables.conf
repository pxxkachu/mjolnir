#!/usr/sbin/nft -f
# Mjolnir — default filter: drop unsolicited WAN; allow Tailscale + loopback.
# HTTPS (Caddy :443) and other services are reachable on the tailnet only.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept

		iif "lo" accept

		# Tailscale fabric (Serve/Caddy/Ollama clients on the tailnet)
		iifname "tailscale0" accept

		# ICMPv4/ICMPv6 (PMTU, ping)
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
